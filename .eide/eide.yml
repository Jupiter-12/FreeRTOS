version: "4.1"
name: FreeRTOS
type: ARM
deviceName: null
packDir: null
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: user
      files:
        - path: src/user/main.c
        - path: src/libraries/Device/ST/STM32F4xx/Source/system_stm32f4xx.c
      folders: []
    - name: libraries
      files: []
      folders:
        - name: ST
          files:
            - path: src/libraries/Device/ST/STM32F4xx/Source/startup/startup_stm32f429_439xx.s
          folders: []
    - name: freertos
      files: []
      folders:
        - name: RVDS
          files: []
          folders: []
        - name: ports
          files: []
          folders: []
        - name: source
          files: []
          folders: []
    - name: doc
      files: []
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 732a9c44a6e92d836ea182885a718982
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_STDPERIPH_DRIVER
        - STM32F429_439xx
      incList:
        - src/libraries/ARM/CMSIS/5.9.0/CMSIS/Core/Include
        - src/libraries/Device/ST/STM32F4xx/Include
        - src/libraries/Device/ST/STM32F4xx/StdPeriph_Driver/inc
      libList: []
    excludeList: []
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: none
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-clang
            misc-controls: -masm=auto
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: gnu17
            language-cpp: gnu++17
            one-elf-section-per-function: true
            optimization: level-0
            warnings: ac5-like-warnings
          global:
            output-debug-info: dwarf-3
          linker:
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x5000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x10000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: <YOUR_LINKER_SCRIPT>.lds
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
